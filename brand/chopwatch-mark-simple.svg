<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ChopWatch">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#b6f26d" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#3dcf8e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#12150f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="15%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#e7ffb0"/>
      <stop offset="50%" stop-color="#b6f26d"/>
      <stop offset="100%" stop-color="#5fa83c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#12150f"/>
  <circle cx="256" cy="248" r="196" fill="url(#glow)"/>

  <!-- Watching eye -->
  <path
    d="M96 256 C160 150 352 150 416 256 C352 362 160 362 96 256 Z"
    fill="none"
    stroke="#e8f0df"
    stroke-width="36"
    stroke-linejoin="round"
  />
  <circle cx="256" cy="256" r="42" fill="#b6f26d"/>

  <!-- Chop slash -->
  <path
    d="M120 96 L392 416"
    fill="none"
    stroke="url(#blade)"
    stroke-width="52"
    stroke-linecap="round"
  />
</svg>
