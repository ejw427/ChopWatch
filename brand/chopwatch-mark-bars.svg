<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ChopWatch">
  <defs>
    <radialGradient id="glow" cx="52%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#b6f26d" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#3dcf8e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#12150f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5fa83c"/>
      <stop offset="55%" stop-color="#b6f26d"/>
      <stop offset="100%" stop-color="#e7ffb0"/>
    </linearGradient>
    <linearGradient id="frame" x1="15%" y1="12%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#f3f8ea"/>
      <stop offset="100%" stop-color="#9eb28c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#12150f"/>
  <circle cx="260" cy="250" r="196" fill="url(#glow)"/>

  <!-- HUD corner brackets (viewport / watching) -->
  <path
    d="M118 168 V128 H168 M344 128 H394 V168 M394 344 V384 H344 M168 384 H118 V344"
    fill="none"
    stroke="url(#frame)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Chopping / GPU activity bars -->
  <rect x="168" y="268" width="48" height="84" rx="14" fill="url(#bar)"/>
  <rect x="232" y="212" width="48" height="140" rx="14" fill="url(#bar)"/>
  <rect x="296" y="160" width="48" height="192" rx="14" fill="url(#bar)"/>

  <!-- Live status -->
  <circle cx="372" y="160" r="18" fill="#b6f26d"/>
</svg>
