name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'chopwatch' }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-installers' }}

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install helper dependencies
        run: npm ci --prefix helper

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Unit tests
        run: npm test

      - name: Build Windows artifacts (unsigned)
        run: npm run dist
        env:
          # Local/community builds stay unsigned unless SignPath signs below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload unsigned artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: chopwatch-windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Sign with SignPath (optional, free OSS)
        id: signpath
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed

      - name: Prefer signed artifacts when available
        if: ${{ steps.signpath.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Test-Path release-signed)) {
            throw 'SignPath reported success but release-signed/ is missing.'
          }
          Get-ChildItem release-signed -Recurse -Filter *.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path 'release' $_.Name) -Force
            Write-Host "Signed: $($_.Name)"
          }

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem release -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($_.Name)"
            Write-Host "$($_.Name)  $hash"
          }
          if ($lines.Count -eq 0) { throw 'No .exe files found under release/ for checksums.' }
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'release/SHA256SUMS.txt'),
            (($lines -join "`n") + "`n")
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chopwatch-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Verify downloads

            Compare `SHA256SUMS.txt` with:

            ```powershell
            Get-FileHash .\ChopWatch*.exe -Algorithm SHA256
            ```

            Builds are unsigned unless SignPath OSS signing is configured (see `docs/SIGNING.md`). SmartScreen may warn — *More info* → *Run anyway* if you trust the hash.
          files: |
            release/*.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
