name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, docs sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install helper dependencies
        run: npm ci --prefix helper

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build --prefix web

      - name: Regenerate docs HTML
        run: npm run docs:html

      - name: Verify generated docs are current
        run: git diff --exit-code -- .
